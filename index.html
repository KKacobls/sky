<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d2a">
<title>光遇｜先祖位置圖</title>
<style>
:root{color-scheme:dark;--bg:#101d2a;--panel:#1b3042;--line:#344c60;--text:#eef6fa;--accent:#b6e4ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Microsoft JhengHei",sans-serif}
main{max-width:1000px;margin:auto;padding:0 8px 20px}
nav{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:10px 0;background:var(--bg)}
button{font:inherit;cursor:pointer}
.tab{min-width:0;padding:10px 0;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);font-size:15px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#102e3c;font-weight:700}
#gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;align-items:stretch}
.tile{min-width:0;width:100%;padding:0;display:flex;align-items:center;justify-content:center;background:#0b1620;border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:1.43}
.tile img{display:block;width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.missing{font-size:12px;color:#9eb2c0;text-align:center;padding:8px}
#message{margin:10px 0;color:#9eb2c0;text-align:center;font-size:12px}
footer{text-align:center;font-size:11px;margin-top:14px;color:#9eb2c0}
footer a{color:inherit}
dialog{padding:0;border:0;background:#08121b;width:98vw;max-width:1400px;max-height:96dvh;overflow:auto}
dialog::backdrop{background:#000e}
dialog img{display:block;width:100%;max-height:88dvh;object-fit:contain}
#close{display:block;margin:6px 6px 6px auto;padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
@media(min-width:800px){main{padding:0 12px 24px}nav{gap:8px;padding:12px 0}#gallery{gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
<nav id="tabs" aria-label="地圖" role="tablist"></nav>
<div id="gallery"></div>
<div id="message" role="status" hidden></div>
<footer>圖片來源：<a href="https://wiki.biligame.com/sky/" target="_blank" rel="noopener">BWiki</a> · <a href="https://www.18183.com/" target="_blank" rel="noopener">18183</a></footer>
</main>
<dialog id="zoom"><button id="close" aria-label="關閉圖片">✕</button><img id="large" alt="先祖位置圖"></dialog>
<script>
(async()=>{
const $=id=>document.getElementById(id);
const ids=['prairie','forest','valley','wasteland','vault'];
const [data,manifest]=await Promise.all([
fetch('spirits.json').then(r=>{if(!r.ok)throw Error('先祖資料載入失敗');return r.json()}),
fetch('images/manifest.json').then(r=>r.ok?r.json():{}).catch(()=>({}))
]);
const maps=ids.map(id=>data.find(m=>m.id===id)).filter(Boolean);
let current=maps.some(m=>m.id===location.hash.slice(1))?location.hash.slice(1):ids[0];
function render(){
const m=maps.find(x=>x.id===current);
$('tabs').replaceChildren();
maps.forEach(map=>{
const b=document.createElement('button');
b.className='tab';b.textContent=map.name;b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(map.id===current));
b.onclick=()=>{current=map.id;history.replaceState(null,'','#'+current);render();window.scrollTo(0,0)};
$('tabs').append(b);
});
$('gallery').replaceChildren();
let missing=0;
for(const s of m.spirits){
const path=manifest[String(s.id)]?.path;
if(!path){missing++;continue}
const b=document.createElement('button');
b.className='tile';b.type='button';b.setAttribute('aria-label','放大位置圖');
const im=document.createElement('img');
im.alt='先祖位置圖';im.src=path;im.loading='lazy';im.decoding='async';
im.onerror=()=>{b.disabled=true;b.replaceChildren();b.textContent='圖片讀取失敗';b.classList.add('missing')};
b.onclick=()=>{$('large').src=path;$('zoom').showModal()};
b.append(im);$('gallery').append(b);
}
$('message').hidden=!missing;$('message').textContent=missing?missing+' 張位置圖尚缺':'';
}
$('close').onclick=()=>$('zoom').close();
$('zoom').onclick=e=>{if(e.target===$('zoom'))$('zoom').close()};
render();
})().catch(e=>{const el=document.getElementById('message');el.hidden=false;el.textContent=e.message||'載入失敗，請重新整理'});
</script>
</body>
</html>
